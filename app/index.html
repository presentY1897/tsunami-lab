<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060d1a">
<title data-i18n="app.title">쓰나미 랩</title>
<meta name="description" data-i18n-content="app.description" content="지진이나 소행성 충돌로 생긴 쓰나미가 지구 위에서 어떻게 퍼지는지 보여 주는 시뮬레이터.">
</head>
<body>
<canvas id="globe" aria-label="삼각형 면으로 그린 지구. 끌어서 돌리고, 두 손가락이나 휠로 확대합니다." data-i18n-aria-label="a11y.globe"></canvas>
<div id="labels" class="labels" aria-hidden="true"></div>
<svg id="overlay" class="overlay" aria-hidden="true"><polygon id="faultShape" /><line id="faultTrench" /></svg>
<div id="marker" hidden></div>
<div id="pulse" class="pulse" hidden></div>
<div id="streak" class="streak" hidden></div>
<div id="flash" class="flash" hidden></div>
<div id="coastMarker" class="coastmarker" hidden></div>
<header class="top">
  <h1 data-i18n="app.title">쓰나미 랩</h1>
  <div class="topright">
    <div class="toggles">
      <select id="language" class="language" aria-label="언어" data-i18n-aria-label="a11y.language"><option value="ko">한국어</option><option value="en">English</option></select>
      <button type="button" id="viewReset" class="toggle" hidden data-i18n="view.reset">시점 되돌리기</button>
      <button type="button" id="linesToggle" class="toggle" aria-pressed="true" data-i18n="view.boundaries">실제 경계선</button>
      <button type="button" id="citiesToggle" class="toggle" aria-pressed="true" data-i18n="view.cities">도시</button>
    </div>
  </div>
</header>
<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheethead" id="sheetHead">
    <span class="grip" aria-hidden="true"></span>
    <span id="sheetMini" class="sheetmini"></span>
    <button type="button" id="playMini" class="toggle playmini" aria-label="재생" data-i18n-aria-label="action.play" hidden>▶</button>
    <button type="button" id="sheetToggle" class="toggle" aria-expanded="true" data-i18n="panel.collapse">접기</button>
  </div>
  <div id="sheetBody">
  <p id="readout" class="readout" data-i18n="intro">지구를 끌어서 돌리고, 두 손가락으로 확대해 보세요. 바다를 누르면 그곳에 해저 지진을 일으킬 수 있습니다.</p>

  <div class="field"><label for="seaLevel"><span data-i18n="sea.label">해수면 상승</span> <output id="seaLevelValue">0 m</output></label><input type="range" id="seaLevel" min="0" max="1000" step="1" value="0" aria-describedby="seaLevelNote"></div>
  <p id="seaLevelNote" class="sub" data-i18n="sea.note">현재 해수면 기준 · 수위를 바꾸면 진행 중인 계산이 초기화됩니다.</p>
  <button type="button" id="seaLevelReset" class="toggle" data-i18n="sea.reset">수위 0 m로</button>

  <div id="quakePanel" class="panel" hidden>
    <div class="seg" role="group" aria-label="발생원 종류" data-i18n-aria-label="a11y.source">
      <button type="button" id="kindQuake" aria-pressed="true" data-i18n="source.quake">해저 지진</button>
      <button type="button" id="kindImpact" aria-pressed="false" data-i18n="source.impact">소행성 충돌</button>
    </div>
    <div id="quakeFields">
      <div class="field"><label for="mw"><span data-i18n="source.magnitude">규모</span> <output id="mwv"></output></label><input type="range" id="mw" min="7.5" max="10.5" step="0.1" value="9"></div>
      <div class="field"><label for="strike"><span data-i18n="source.strike">단층 방향</span> <output id="strikev"></output></label><input type="range" id="strike" min="0" max="359" step="1" value="0"></div>
    </div>
    <div id="impactFields" hidden>
      <div class="field"><label for="diam"><span data-i18n="source.diameter">지름</span> <output id="diamv"></output></label><input type="range" id="diam" min="0" max="1" step="0.001" value="0.6"></div>
      <div class="field"><label for="vel"><span data-i18n="source.velocity">충돌 속도</span> <output id="velv"></output></label><input type="range" id="vel" min="11" max="40" step="1" value="20"></div>
      <div class="field"><label for="rho" data-i18n="source.material">재질</label><select id="rho"><option value="3000" data-i18n="material.rock">암석 (3,000 kg/m³)</option><option value="7800" data-i18n="material.iron">철 (7,800 kg/m³)</option><option value="1000" data-i18n="material.ice">얼음 (1,000 kg/m³)</option></select></div>
    </div>
    <p id="faultinfo" class="sub"></p>
    <div class="coastrow"><p id="coastinfo" class="sub"></p><button type="button" id="pickCoast" data-i18n="coast.select">해안 고르기</button></div>
    <button type="button" id="go" class="primary" data-i18n="sim.start">쓰나미 일으키기</button>
  </div>

  <div id="simPanel" class="panel" hidden>
    <div class="simtop"><b id="clock" data-i18n="time.zero">0분</b><span id="simstate"></span></div>
    <div class="timeline">
      <button type="button" id="play" class="play" aria-label="재생" data-i18n-aria-label="action.play">▶</button>
      <input type="range" id="timeline" min="0" max="21600" step="60" value="0" aria-label="시각" data-i18n-aria-label="a11y.time">
      <span id="timelineEnd" class="tlend" data-i18n="time.sixHours">6시간</span>
    </div>
    <div class="speeds" role="group" aria-label="재생 속도. 1초에 흐르는 시간" data-i18n-aria-label="a11y.speed">
      <span class="speedlabel" data-i18n="speed.label">배속</span>
      <button type="button" data-speed="120" aria-pressed="true" data-i18n="speed.two">2분</button>
      <button type="button" data-speed="600" data-i18n="speed.ten">10분</button>
      <button type="button" data-speed="1800" data-i18n="speed.thirty">30분</button>
      <button type="button" data-speed="max" data-i18n="speed.max">최대</button>
    </div>
    <div id="stats" class="stats" hidden></div>
    <div class="checks"><button type="button" id="floodToggle" class="toggle" aria-pressed="true" data-i18n="flood.toggle">최대 침수 범위 색칠</button></div>
    <div class="seg" role="group" aria-label="파도 높이 그리기" data-i18n-aria-label="a11y.wave">
      <button type="button" data-wavescale="real" data-i18n="wave.real">실제 비율</button>
      <button type="button" data-wavescale="coastReal" aria-pressed="true" data-i18n="wave.coastReal">해안은 실제</button>
      <button type="button" data-wavescale="boost" data-i18n="wave.boost">과장</button>
    </div>
    <div class="actions"><button type="button" id="editSource" data-i18n="source.edit">발생원 수정</button><button type="button" id="rerun" data-i18n="sim.rerun">다시 일으키기</button><button type="button" id="share" data-i18n="share.copy">링크 복사</button></div>
  </div>

  <details class="details" id="moreInfo">
    <summary data-i18n="details">자세히</summary>
    <p id="simDetail" class="sub" hidden></p>
    <p id="wavescaleNote" class="sub"></p>
    <p id="meshinfo" class="sub"></p>
    <p id="generated" class="sub" hidden data-i18n="terrain.generated">10 km보다 세밀한 지형은 실제가 아니라 만들어 낸 것입니다.</p>
    <p class="sub" data-i18n="terrain.notice">10 km 자료를 보간한 지형이라 예시이지 그 장소의 예측이 아닙니다.</p>
    <button type="button" id="reset" class="toggle" data-i18n="source.reset">처음부터 새로 고르기</button>
  </details>
  </div>
</section>
<div id="fatal" class="fatal" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
